name: api

# Pruebas de API de caja negra con la coleccion de Postman, ejecutada con
# Newman (el ejecutor de linea de comandos de Postman) contra el servicio
# levantado de verdad: el mismo jar que se desplegaria.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newman:
    name: Coleccion de Postman con Newman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar el servicio
        run: mvn -B -DskipTests package
        working-directory: registraduria

      - name: Levantar el servicio
        run: |
          nohup java -jar registraduria/target/registraduria-1.0-SNAPSHOT.jar > servicio.log 2>&1 &
          timeout 90 bash -c 'until curl -s -o /dev/null http://localhost:8080; do sleep 1; done'

      # Version fija de Newman: la herramienta tambien es parte del ambiente.
      - name: Ejecutar la coleccion
        run: >
          npx -y newman@6.2.1 run postman/registraduria.postman_collection.json
          -e postman/local.postman_environment.json
          --reporters cli,junit
          --reporter-junit-export newman/resultados.xml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-newman
          path: |
            newman/
            servicio.log
          if-no-files-found: ignore
